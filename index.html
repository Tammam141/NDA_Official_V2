<body class="bio-body">

  <div class="bio-container" data-aos="zoom-in" data-aos-duration="1000">

    <!-- Top Action Toggles -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <!-- Language Selection Dropdown -->
      <div class="dropdown">
        <button class="btn btn-sm py-1 px-2 border-0 opacity-75" type="button" id="langDropdown"
          data-bs-toggle="dropdown" aria-expanded="false" style="color: var(--nda-neutral-dark);">
          <i class="fas fa-globe me-1"></i><span id="currentLangLabel" class="fw-bold">ID</span>
        </button>
        <ul class="dropdown-menu shadow border-0" aria-labelledby="langDropdown">
          <li>
            <a class="dropdown-item lang-item active d-flex justify-content-between align-items-center" data-lang="id"
              href="#">
              <span>ID</span><i class="fas fa-check fs-xs opacity-50 ms-2"></i>
            </a>
          </li>
          <li>
            <a class="dropdown-item lang-item d-flex justify-content-between align-items-center" data-lang="en"

        </ul>
      </div>

      <button class="btn btn-sm py-1 px-2 border-0 opacity-75 d-inline-flex align-items-center gap-1" id="themeToggle"

    <!-- Profile Info -->
    <div class="profile-section mb-4">

      <h1 class="bio-title brand-font fw-bold">NDA OFFICIAL</h1>
      <span class="bio-tagline">Bring Beauty, Feel Comfort</span>

    <!-- Navigation Buttons -->
    <div class="link-group">

      <!-- Official Website (to home.html) -->
      <a href="home.html" class="bio-btn">
        <i class="fas fa-globe"></i>
        <span data-i18n="bio_website_btn">Official Website</span>
      </a>

      <!-- Shopee Link -->
      <a href="https://shopee.co.id/nda.onlinestore" target="_blank" class="bio-btn">
        <i class="fas fa-shopping-bag"></i>
        <span data-i18n="bio_shopee_btn">Shopee</span>
      </a>

      <!-- TikTok Link -->
      <a href="https://www.tiktok.com/@nda.official.store?_t=ZS-8zT46ku2l0L&_r=1" target="_blank" class="bio-btn">
        <i class="fab fa-tiktok"></i>
        <span data-i18n="bio_tiktok_btn">TikTok Shop</span>
      </a>

      <!-- WhatsApp Direct Contact -->
      <a href="https://wa.me/628568636423" target="_blank" class="bio-btn bio-btn-wa">
        <i class="fab fa-whatsapp"></i>
        <span data-i18n="bio_wa_btn">Hubungi miNDA!</span>
      </a>

    <!-- Social Media Footer links -->
    <div class="bio-social-footer">
      <div class="bio-social-icons">
        <a href="https://www.instagram.com/nda.official.store/" target="_blank" title="Instagram"><i
            class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/share/1DcVybD8Mk/" target="_blank" title="Facebook"><i
            class="fab fa-facebook"></i></a>
        <a href="https://shopee.co.id/nda.onlinestore" target="_blank" title="Shopee Store"><i
